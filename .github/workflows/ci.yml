name: Save Shield CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: save-shield/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npx tsc -b

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Output
        run: npm run build
